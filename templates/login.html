<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Move2link Web</title>
<style>body{font-family:system-ui,sans-serif;max-width:380px;margin:4rem auto;padding:0 1rem}
input,button{font:inherit;padding:.6rem;width:100%;box-sizing:border-box;margin-top:.5rem}
button{background:#2563eb;color:#fff;border:0;border-radius:8px;cursor:pointer}
.err{color:#dc2626}</style></head>
<body>
<h1>Move2link Web</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post">
  <input type="password" name="password" placeholder="Password" autofocus>
  <button type="submit">Masuk</button>
</form>
</body>
</html>
